<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Quest Login</title>
</head>
<body>
  <h1>Log in to Job Quest</h1>

  <form id="login-form">
    <label>
      Email
      <input name="email" type="email" required>
    </label>

    <label>
      Password
      <input name="password" type="password" required>
    </label>

    <button type="submit">Log in</button>
  </form>

  <p id="result" aria-live="polite"></p>

  <script>
    const form = document.querySelector("#login-form");
    const result = document.querySelector("#result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = form.elements.email.value;
      const password = form.elements.password.value;

      try {
        const response = await fetch("http://127.0.0.1:8000/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: new URLSearchParams({
            username: email,
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          result.textContent = `Login failed (${response.status}): ${data.detail}`;
          return;
        }

        result.textContent = "Login succeeded. The server returned a token; we are not storing it yet.";
      } catch (error) {
        console.error(error);
        result.textContent = "The request could not be completed. Check the browser console.";
      }
    });
  </script>
</body>
</html>
